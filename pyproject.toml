[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "sublime_music"
authors = [
    {name = "Sumner Evans", email = "inquiries@sumnerevans.com"}
]
dynamic = ["version", "description"]
readme = "README.md"
requires-python = ">=3.10,<4"
license = {file = "LICENSE"}
keywords = ["airsonic", "music", "GTK", "chromecast", "subsonic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX",
    "Topic :: Multimedia :: Sound/Audio :: Players",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]

dependencies = [
    "bleach",
    "bottle",
    "dataclasses-json",
    "peewee",
    "pychromecast",
    "PyGObject",
    "python-dateutil",
    "mpv",
    "requests",
    "semver",
    "thefuzz",
]

[project.optional-dependencies]
dev = [
    # Pinned to major versions so that `make lint` gives the same answer next year.
    "black >=26, <27",
    "flake8 >=7, <8",
    "flake8-annotations",
    "flake8-bugbear",
    "flake8-comprehensions",
    "flake8-pep3101",
    "flake8-print",
    "isort >=6",
    # Newer mypy releases reject the dataclasses-json decorator stack and the peewee
    # query patterns this code relies on; 1.2 is what it was written against.
    "mypy >=1.2, <1.3",
    "types-bleach",
    "types-peewee >=4, <5",
    "types-python-dateutil",
    "types-requests",
]
doc = [
    "docutils <0.17",
    "rst2html5",
    "sphinx <5",
    "sphinx_rtd_theme",
]
test = [
    "pytest",
    "pytest-cov",
]
keyring = ["keyring"]

[project.urls]
Homepage = "https://sublimemusic.app"
Documentation = "https://docs.sublimemusic.app"
"Source Code" = "https://github.com/sublime-music/sublime-music"
"Bug Tracker" = "https://github.com/sublime-music/sublime-music/issues"

[project.scripts]
sublime-music = 'sublime_music.__main__:main'

[tool.isort]
profile = "black"
combine_as_imports = true
known_first_party = "sublime_music"
line_length = 99

[tool.black]
line-length = 99
target-version = ["py310"]
